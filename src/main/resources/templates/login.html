<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; }
        .box { width: 340px; margin: 80px auto; padding: 24px; background: white; border-radius: 12px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; }
        button { width: 100%; padding: 12px; background: teal; color: white; border: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Login Mahasiswa</h2>
        <p th:if="${param.error}">Username atau password salah</p>
        <p th:if="${param.logout}">Anda berhasil logout</p>
        <p th:if="${param.registered}" style="color: green;">Registrasi berhasil, silakan login</p>

        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Username" />
            <input type="password" name="password" placeholder="Password" />
            <button type="submit">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            <a th:href="@{/register}">Belum punya akun? Daftar di sini</a>
        </p>
    </div>
</body>
</html>

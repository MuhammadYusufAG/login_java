<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Mahasiswa</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-fuchsia-600 flex items-center justify-center p-4">

    <!-- Container Utama dengan efek Glassmorphism -->
    <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl shadow-2xl p-8 w-full max-w-md">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="bg-white/20 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4 shadow-inner">
                <i class="fa-solid fa-graduation-cap text-4xl text-white"></i>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Selamat Datang</h2>
            <p class="text-indigo-100 mt-2">Silakan login ke akun mahasiswa Anda</p>
        </div>

        <!-- Notifikasi -->
        <div th:if="${param.error}" class="bg-red-500/80 backdrop-blur-sm text-white px-4 py-3 rounded-xl mb-6 flex items-center shadow-sm">
            <i class="fa-solid fa-circle-exclamation mr-3"></i>
            <span>Username atau password salah.</span>
        </div>
        <div th:if="${param.logout}" class="bg-emerald-500/80 backdrop-blur-sm text-white px-4 py-3 rounded-xl mb-6 flex items-center shadow-sm">
            <i class="fa-solid fa-circle-check mr-3"></i>
            <span>Anda berhasil logout.</span>
        </div>
        <div th:if="${param.registered}" class="bg-blue-500/80 backdrop-blur-sm text-white px-4 py-3 rounded-xl mb-6 flex items-center shadow-sm">
            <i class="fa-solid fa-user-check mr-3"></i>
            <span>Registrasi berhasil, silakan login!</span>
        </div>

        <!-- Form Login -->
        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-indigo-100 text-sm font-medium mb-1 pl-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-user text-indigo-300"></i>
                    </div>
                    <input type="text" name="username" placeholder="Masukkan username" required
                        class="w-full pl-11 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-fuchsia-400 focus:border-transparent transition-all duration-300">
                </div>
            </div>
            
            <div>
                <label class="block text-indigo-100 text-sm font-medium mb-1 pl-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-indigo-300"></i>
                    </div>
                    <input type="password" name="password" placeholder="Masukkan password" required
                        class="w-full pl-11 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-indigo-200/50 focus:outline-none focus:ring-2 focus:ring-fuchsia-400 focus:border-transparent transition-all duration-300">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-3.5 bg-gradient-to-r from-fuchsia-500 to-purple-500 hover:from-fuchsia-400 hover:to-purple-400 text-white rounded-xl font-semibold shadow-lg transform hover:-translate-y-0.5 transition-all duration-300 mt-4">
                Masuk Sekarang
            </button>
        </form>

        <!-- Footer / Link -->
        <p class="text-center text-indigo-200 mt-8 text-sm">
            Belum punya akun? 
            <a th:href="@{/register}" class="font-semibold text-white hover:text-fuchsia-300 hover:underline transition-colors duration-200">Daftar di sini</a>
        </p>

    </div>
</body>
</html>
